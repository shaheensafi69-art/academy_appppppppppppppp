name: safi_academy_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.16.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo-without-b.png
    - assets/icon/

# 🔥 تنظیمات خودکار آیکون اپلیکیشن (بر اساس عکس‌های پوشه icon)
flutter_launcher_icons:
  image_path: "assets/icon/icon-1024x1024.png"
  android: true
  ios: true