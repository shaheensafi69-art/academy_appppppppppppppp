name: safi_academy_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.16.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  local_auth: ^3.0.1         # پکیج جدید برای قفل پین و اثر انگشت / بیومتریک
  device_info_plus: ^11.2.0    # پکیج جدید برای شناسایی نوع و مدل دیوایس
  dio: ^5.4.0                  # برای دانلود فایل‌ها در پس‌زمینه
  http: ^1.2.0
  path_provider: ^2.1.2       # برای دسترسی به مسیرهای ذخیره‌سازی موبایل
  permission_handler: ^11.3.1  # برای مدیریت مجوزهای دسترسی حافظه
  flutter_pdfview: ^1.4.0      # برای نمایش فایل‌های PDF در داخل اپلیکیشن برای مدیریت مجوزهای دسترسی حافظهی نوع و مدل دیوایس
  dropdown_search: ^7.0.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.3
  video_player: ^2.9.2

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo-without-b.png
    - assets/logo.png
    - assets/facebook.com-logo.webp
    - assets/intagram.com-logo.webp
    - assets/linkedin.com-logo.webp
    - assets/whatsapp.com-logo.webp
    - assets/x.com-logo.webp

# 🔥 تنظیمات خودکار آیکون اپلیکیشن (بر اساس عکس‌های پوشه icon)
flutter_launcher_icons:
  image_path: "assets/icon/icon-1024x1024.png"
  android: true
  ios: true